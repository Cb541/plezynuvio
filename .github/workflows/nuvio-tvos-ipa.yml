name: Build Nuvio External Player tvOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - nuvio-direct-stream-tvos
      - nuvio-on-demand-thumbnails-tvos
      - nuvio-external-player-tv

permissions:
  contents: read

jobs:
  build-tvos:
    name: Build unsigned Plezy tvOS IPA
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      # Flutter 3.47.1 release AOT can abort with:
      # "Class with illegal cid, full-aot: _window_macos.dart _Rect"
      # (flutter/flutter#191575). This experimental windowing feature is
      # unused on tvOS. Disable it inside this disposable build runner only.
      - name: Disable unused experimental Flutter windowing during tvOS AOT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          sdk = Path(shutil.which("flutter")).resolve().parent.parent
          features = sdk / "packages/flutter/lib/src/foundation/_features.dart"
          original = features.read_text()
          before = "bool isWindowingEnabled = debugEnabledFeatureFlags.contains('windowing');"
          if before not in original:
              raise SystemExit(f"Flutter windowing workaround target missing: {features}")
          features.write_text(original.replace(before, "bool isWindowingEnabled = false;"))
          print("Disabled unused Flutter experimental windowing for this tvOS CI build.")
          PY

      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Run Nuvio URL parser tests
        run: flutter test --no-pub test/services/nuvio_stream_link_test.dart

      - name: Test seek preview cache and Nuvio parsing
        run: flutter test --no-pub test/services/nuvio_seek_thumbnails_test.dart

      - name: Test Siri Remote touch seeking
        run: flutter test --no-pub test/services/nuvio_touch_seek_test.dart

      - name: Analyze changed Dart integration
        run: dart analyze lib/services/nuvio_stream_link.dart lib/services/nuvio_seek_thumbnails.dart lib/services/nuvio_touch_seek.dart lib/screens/nuvio_stream_player_screen.dart lib/screens/nuvio_external_player_app.dart lib/main.dart

      - name: Prepare verified tvOS Flutter engine
        run: bash tvos/scripts/fetch_engine.sh

      - name: Install tvOS pods
        run: bash tvos/scripts/pod_install.sh

      - name: Verify tvOS native wiring
        run: |
          ruby tvos/scripts/wire_mpv.rb
          ruby tvos/scripts/test_wire_mpv.rb
          ruby tvos/scripts/test_wire_top_shelf.rb

      - name: Build unsigned tvOS archive
        run: |
          xcodebuild archive \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath "$PWD/build/NuvioPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned Plezy IPA
        run: |
          APP="$(find "$PWD/build/NuvioPlayer.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP" ]; then
            echo "No app found in tvOS archive" >&2
            exit 1
          fi
          mkdir -p "$PWD/build/plezy-ipa/Payload"
          cp -R "$APP" "$PWD/build/plezy-ipa/Payload/"
          cd "$PWD/build/plezy-ipa"
          zip -qry NuvioPlayer-tvOS-unsigned.ipa Payload
          test -f NuvioPlayer-tvOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioPlayer-tvOS-unsigned
          path: build/plezy-ipa/NuvioPlayer-tvOS-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
