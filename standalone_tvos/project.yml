name: NuvioNativePlayer
options:
  bundleIdPrefix: com.cb541
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "16.0"
packages:
  MPVKit:
    url: https://github.com/edde746/mpv-build
    revision: 690a755f66c21240515bb2ef84f86a9187652856
targets:
  NuvioNativePlayer:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../shared/apple/MpvPlayer/MpvPlayerCoreBase.swift
      - path: ../ios/Runner/MpvPlayer/MpvPlayerCore.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nuvio Player
        CFBundleName: Nuvio Player
        CFBundleShortVersionString: "1.1.3"
        CFBundleVersion: "11"
        CFBundleURLTypes:
          - CFBundleURLName: com.cb541.nuvio.player
            CFBundleURLSchemes:
              - nuvio-player
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).NuvioSceneDelegate"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cb541.nuvionativeplayer
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FFmpegThumbnailBridge.h
        CLANG_ENABLE_MODULES: NO
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TVOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    dependencies:
      - package: MPVKit
        product: MPVKit
schemes:
  NuvioNativePlayer:
    build:
      targets:
        NuvioNativePlayer: all
    archive:
      config: Release
