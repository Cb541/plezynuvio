name: NuvioNativePlayer
options:
  bundleIdPrefix: com.cb541
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "16.0"
packages:
  MPVKit:
    url: https://github.com/edde746/mpv-build
    revision: 690a755f66c21240515bb2ef84f86a9187652856
targets:
  NuvioNativePlayer:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: ../shared/apple/MpvPlayer/MpvPlayerCoreBase.swift
      - path: ../ios/Runner/MpvPlayer/MpvPlayerCore.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cb541.nuvionativeplayer
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TVOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: MPVKit
        product: MPVKit
schemes:
  NuvioNativePlayer:
    build:
      targets:
        NuvioNativePlayer: all
    archive:
      config: Release
